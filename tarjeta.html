<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta de presentación — GURIS3</title>
  <meta name="description" content="Tarjeta de presentación de GURIS3 Solutions">
  <link rel="icon" href="assets/logo-transparente.png">
  <link rel="stylesheet" href="tarjeta.css">
</head>
<body>
  <main>
    <p class="eyebrow">Tarjeta de presentación · 90 × 50 mm</p>

    <article class="tarjeta" aria-label="Tarjeta de presentación de GURIS3 Solutions">
      <div class="halo halo-uno" aria-hidden="true"></div>
      <div class="halo halo-dos" aria-hidden="true"></div>
      <div class="trama" aria-hidden="true"></div>

      <section class="identidad">
        <img class="logo" src="assets/logo-transparente.png" alt="GURIS3 Solutions">
        <p class="frase">Soluciones digitales<br>pensadas para <strong>pequeños y medianos negocios.</strong></p>
      </section>

      <section class="contacto">
        <a class="qr-link" href="https://guris3.com.ar" aria-label="Visitar guris3.com.ar">
          <span class="qr-marco">
            <img src="assets/qr-guris3.svg" alt="Código QR a guris3.com.ar">
          </span>
          <span class="visitanos">Escaneá y conocenos</span>
          <span class="web">guris3.com.ar</span>
        </a>
      </section>
    </article>

    <button class="imprimir" type="button" onclick="window.print()">Imprimir / guardar como PDF</button>
    <p class="nota">Al imprimir, activá “gráficos de fondo” y usá escala 100%.</p>
  </main>
</body>
</html>
